<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!-- Tailwind and daisyUI -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <main class="min-h-screen bg-base-200 w-full p-5">
        <section class="w-100 p-2.5 shadow-lg border-2 border-base-200 rounded-xl  mx-auto bg-white min-h-100">



            <header class="h-25 flex justify-between items-center border-b  border-gray-300">
                <div>
                    

                    <div class="flex items-center ">
                        <i  class="fa-solid text-2xl text-red-400 fa-dollar-sign"></i>
                        <h1 id="current-amount" class="text-2xl text-red-400 font-bold">20000</h1>
                    </div>
                    <p class="text-xs ml-2">Available Balance</p>

                </div>

                <div>
                    <button onclick="window.location.href='/'" class="btn btn-outline btn-error">Signout</button>
                </div>

               
            </header>
             

            <div  class="grid grid-cols-3 gap-2 mt-5">
                <div id="add-money-btn" class="h-20 bg-red-400 shadow-sm rounded-lg flex items-center justify-center">
                   <div class="text-center ">
                     <div class="h-8 w-8 mx-auto bg-white rounded-sm flex items-center justify-center">
                        <i class="fa-solid fa-sack-dollar"></i>
                    </div>

                    <p class="font-bold mt-1">Add Money</p>
                   </div>
                </div>
                <div id="cashout-btn" class="h-20  shadow-sm rounded-lg flex items-center justify-center">
                   <div class="text-center ">
                     <div class="h-8 w-8 mx-auto bg-white rounded-sm flex items-center justify-center">
                        <i class="fa-solid fa-cash-register"></i>
                    </div>

                    <p class="font-bold mt-1">Cashout</p>
                   </div>
                </div>
                <div class="h-20  shadow-sm rounded-lg flex items-center justify-center">
                   <div class="text-center ">
                     <div class="h-8 w-8 mx-auto bg-white rounded-sm flex items-center justify-center">
                        <i class="fa-solid fa-money-bill-transfer"></i>
                    </div>

                    <p class="font-bold mt-1">Transfer</p>
                   </div>
                </div>
                <div class="h-20 shadow-sm rounded-lg flex items-center justify-center">
                   <div class="text-center ">
                     <div class="h-8 w-8 mx-auto bg-white rounded-sm flex items-center justify-center">
                       <i class="fa-solid fa-money-bill-1-wave"></i>
                    </div>

                    <p class="font-bold mt-1">Paybill</p>
                   </div>
                </div>
                <div class="h-20  shadow-sm rounded-lg flex items-center justify-center">
                   <div class="text-center ">
                     <div class="h-8 w-8 mx-auto bg-white rounded-sm flex items-center justify-center">
                     <i class="fa-solid fa-hands-bound"></i>
                    </div>

                    <p class="font-bold mt-1">Bonus</p>
                   </div>
                </div>
                <div id="history-btn" class="h-20  shadow-sm rounded-lg flex items-center justify-center">
                   <div class="text-center ">
                     <div class="h-8 w-8 mx-auto  rounded-sm flex items-center justify-center">
                        <i class="fa-solid fa-bell"></i>
                    </div>

                    <p class="font-bold mt-1">History</p>
                   </div>
                </div>
            </div>

            <div id="add-money-section" class="">
                <form class="fieldset  bg-base-200 border-base-300 rounded-box w-full border p-4 mx-auto my-5">
                    <legend class="fieldset-legend text-2xl text-center mx-auto">Add Money</legend>

                    <label class="label">Select Bank</label>
                    <select id="bank-selector" class="select w-full">
                        <option disabled selected>Select Bank</option>
                        <option>DBBL</option>
                        <option>BRAC</option>
                        <option>CITY</option>
                    </select>
                    <label class="label">Account</label>
                    <input id="account" type="text" class="input w-full" placeholder="Your 11 digit account number" />

                    <label class="label">Balance</label>
                    <input id="balance" type="text" class="input w-full" placeholder="Your balance" />

                    <label class="label">PIN</label>
                    <input id="userPin" type="text" class="input w-full" placeholder="Enter pin" />

                    <button type="submit" id="add-money-feature-btn" class="btn btn-error">Add Money</button>
                </form>
            </div>

            <div id="cashout-section" class="hidden py-5">
                <form class="fieldset my bg-base-200 border-base-300 rounded-box w-full border p-4 mx-auto my-5">
                    <legend class="fieldset-legend text-2xl text-center mx-auto">Add Money</legend>

                    
                    <label class="label">Agent Number</label>
                    <input type="text" class="input w-full" placeholder="Your 11 digit account number" />

                    <label class="label">Cashout Balance</label>
                    <input type="text" class="input w-full" placeholder="Your balance" />

                    <label class="label">PIN</label>
                    <input type="text" class="input w-full" placeholder="Enter pin" />

                    <button id="" class="btn btn-error">Cashout</button>
                </form>
            </div>

            <div id="histoy-section" class="hidden">
                History
            </div>



        </section>
    </main>

    <script src="/src/js/home.js"></script>
</body>
</html>
