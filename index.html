<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Tailwind and daisyUI -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <section class="h-screen w-full flex items-center justify-center">
        <form class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
            <legend class="fieldset-legend mx-auto text-2xl">Login</legend>

            <label class="label">Email</label>
            <input id="email" name="email" type="email" class="input" placeholder="Email" required />

            <label class="label">Password</label>
            <input id="password" name="pass" type="password" class="input" placeholder="Password" required />

            <button type="submit" id="login-btn" class="btn btn-neutral mt-4">Login</button>
        </form>
    </section>

    <script src="src/js/login.js"></script>
</body>
</html>
